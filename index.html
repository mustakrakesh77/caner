<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SC İhtiyaç Listesi</title>
<meta name="theme-color" content="#f4eee4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SC İhtiyaç">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=localStorage.getItem("theme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-top">
    <div>
      <div class="eyebrow">Ortak ev listemiz</div>
      <h1>SC <em>İhtiyaç Listesi</em></h1>
    </div>
    <div class="hero-right">
      <button id="themeBtn" class="themebtn" type="button" aria-label="Tema seç" title="Tema">◐</button>
      <div class="who">Ekleyen<br><button id="whoBtn" type="button">—</button></div>
      <div id="themeMenu" class="thememenu" hidden></div>
    </div>
  </div>
  <nav id="spaces" class="spaces" aria-label="Liste seç"></nav>
  <section id="budget" class="bud" aria-label="Bütçe"></section>
</header>

<main>
  <div id="setup" class="notice" hidden>
    <b>Kurulum eksik.</b> <code>config.js</code> dosyasına Supabase adresini ve anahtarını yazman lazım. README.md'deki adımlara bak.
  </div>

  <section id="dealstrip" class="dealstrip" hidden></section>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Ara…" aria-label="Ara">
    <select id="catSel" aria-label="Kategori"><option value="all">Tüm kategoriler</option></select>
    <select id="sort" aria-label="Sırala">
      <option value="cat">Kategoriye göre</option>
      <option value="price-asc">Fiyat: düşükten yükseğe</option>
      <option value="price-desc">Fiyat: yüksekten düşüğe</option>
      <option value="drop">En çok indirim</option>
    </select>
  </div>
  <div id="chips" class="chips"></div>

  <nav class="tabs">
    <button data-tab="list" class="on">Liste <span id="cList"></span></button>
    <button data-tab="deals">İndirimler <span id="cDeals"></span></button>
    <button data-tab="bought">Alınanlar <span id="cBought"></span></button>
  </nav>

  <div class="refreshbar">
    <button id="refreshBtn" type="button">↻ Fiyatları yenile</button>
    <button id="selBtn" type="button">Seç</button>
    <span id="lastScan"></span>
    <button id="tokReset" type="button" class="linkbtn" hidden>anahtarı sıfırla</button>
  </div>

  <div id="stale" class="notice" hidden></div>
  <div id="summary" class="summary"></div>
  <div id="items"></div>
</main>

<button id="fab" type="button" aria-label="Ürün ekle">+</button>

<dialog id="addDlg">
  <form id="addForm" class="sheet">
    <div class="sheet-head"><h2>Ürün ekle</h2><button type="button" class="x" data-close aria-label="Kapat">✕</button></div>
    <label>Hangi liste<select id="fList"></select></label>
    <label>Ürün linki<input id="fUrl" type="url" placeholder="Trendyol, Hepsiburada, Akakçe… linkini yapıştır" required></label>
    <label>Ürün adı <small>(boş bırakabilirsin; kısa linklerde ty.gl gibi adı ben bulurum)</small><input id="fName" type="text"></label>
    <div class="row2">
      <label>Kategori<select id="fCat"></select></label>
      <label>Adet<input id="fQty" type="number" min="1" step="1" value="1" inputmode="numeric"></label>
    </div>
    <div class="row2">
      <label>Öncelik
        <select id="fPrio"><option value="sart">Şart</option><option value="iyi">Olsa iyi olur</option></select>
      </label>
      <label>Kim alacak?<input id="fWho" list="people" type="text" placeholder="isim"></label>
    </div>
    <label>Hedef fiyat ₺ <small>(altına inince haber vereyim)</small><input id="fTarget" type="number" min="0" step="1" inputmode="numeric"></label>
    <label>Not<textarea id="fNote" rows="2" placeholder="renk, ölçü, mağaza tercihi…"></textarea></label>
    <button type="submit" class="primary">Listeye ekle</button>
  </form>
</dialog>

<dialog id="detailDlg"><div id="detail" class="sheet"></div></dialog>

<datalist id="people"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<div id="toast" class="toast" hidden><span id="toastMsg"></span><button id="toastBtn" type="button"></button></div>

<div id="selbar" class="selbar" hidden>
  <span id="selCount">0 seçili</span>
  <button type="button" id="selAll" class="sb">Tümünü seç</button>
  <button type="button" id="selBuy" class="sb strong">Aldık</button>
  <select id="selCat" aria-label="Kategori değiştir"></select>
  <select id="selList" aria-label="Listeye taşı"></select>
  <button type="button" id="selDel" class="sb danger">Sil</button>
  <button type="button" id="selX" class="sb">Vazgeç</button>
</div>

<script src="config.js"></script>
<script src="categories.js"></script>
<script src="stores.js"></script>
<script src="app.js"></script>
</body>
</html>
