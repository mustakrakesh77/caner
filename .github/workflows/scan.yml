name: Fiyat taraması

on:
  schedule:
    - cron: "17 */2 * * *" # yedek zamanlayıcı; asıl tetikleyici Supabase (supabase/scheduler.sql)
  workflow_dispatch: {}

concurrency:
  group: scan
  cancel-in-progress: false   # çalışan tarama bitsin, bekleyen bir sonraki tek sıra olsun

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Node, ubuntu-latest üzerinde hazır geliyor; ayrıca kurmak gereksiz bekleme.
      - run: node scraper/scan.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
